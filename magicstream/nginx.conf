# The client and the API on one origin: the compiled React app at /, the Go API at /api/.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080/;   # the trailing slash strips /api
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so browsers may keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/login, /stream/…) all load the app.
  location / {
    try_files $uri /index.html;
  }
}
